# Atmosphère-RYZ — automatic build & release
#
# EN: Builds the firmware on every push to main and publishes a clean release named
#     "Ryazhenka v<version.txt>" containing a single atmosphere-ryz.zip
#     (fusee.bin + atmosphere/ + switch/). Also runnable manually.
# RU: Собирает прошивку при каждом push в main и публикует релиз
#     "Ryazhenka v<version.txt>" с единственным архивом atmosphere-ryz.zip
#     (fusee.bin + папки atmosphere/ и switch/). Можно запустить вручную.
name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/upstream-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install toolchain packages & python deps
        run: |
          set -ux
          dkp-pacman -Sy --noconfirm --needed \
            switch-dev switch-glm switch-libjpeg-turbo \
            devkitARM devkitarm-rules hactool || true
          (apt-get update && apt-get install -y --no-install-recommends python3-pip zip unzip) \
            || python3 -m ensurepip --upgrade \
            || dkp-pacman -S --noconfirm python-pip || true
          python3 -m pip install --no-cache-dir --break-system-packages lz4 Pillow \
            || python3 -m pip install --no-cache-dir lz4 Pillow
          python3 -c "import lz4, PIL; print('python deps OK')"

      - name: Read version
        id: ver
        run: |
          VERSION="$(bash scripts/apply_version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Ryazhenka v${VERSION}"

      - name: Build
        run: |
          set -eux
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export DEVKITARM=/opt/devkitpro/devkitARM
          # Default target runs the dist packaging: produces
          #   out/*/release/atmosphere-<ver>.zip  (atmosphere/ + switch/)
          #   out/*/release/fusee.bin
          # The Ryazhenka splash (img/splash.bin) is embedded into package3 by build_package3.py.
          make -j"$(nproc)"

      - name: Assemble atmosphere-ryz.zip
        id: pkg
        run: |
          set -eux
          REL_ZIP="$(ls out/*/release/atmosphere-*.zip 2>/dev/null | grep -v debug | head -n1)"
          FUSEE="$(ls out/*/release/fusee.bin 2>/dev/null | head -n1)"
          test -n "${REL_ZIP}" && test -f "${FUSEE}"
          rm -rf stage atmosphere-ryz.zip
          mkdir -p stage
          unzip -q "${REL_ZIP}" -d stage          # -> stage/atmosphere, stage/switch
          cp "${FUSEE}" stage/fusee.bin
          ( cd stage && zip -r -q ../atmosphere-ryz.zip fusee.bin atmosphere switch )
          echo "--- atmosphere-ryz.zip top-level contents ---"
          ( cd stage && ls -la )
          unzip -l atmosphere-ryz.zip | tail -n +1 | head -n 20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-ryz
          path: atmosphere-ryz.zip
          if-no-files-found: error

      - name: Delete previous release & tag (clean re-release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          REL_ID="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)"
          if [ -n "${REL_ID}" ]; then
            curl -fsSL -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/${REL_ID}" || true
          fi
          curl -fsSL -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/git/refs/tags/${TAG}" || true

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Ryazhenka v${{ steps.ver.outputs.version }}
          make_latest: true
          files: atmosphere-ryz.zip
          body: |
            Ryazhenka v${{ steps.ver.outputs.version }}

            Распакуйте `atmosphere-ryz.zip` в корень SD-карты.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
