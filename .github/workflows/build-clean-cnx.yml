name: Build Clean Atmosphere-CNX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clean-cnx:
    name: Build clean CNX source
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Build with devkitPro
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            devkitpro/devkita64:latest \
            bash -lc 'git config --global --add safe.directory /workspace && make -j"$(nproc)"'

      - name: Verify generated package
        run: |
          set -euo pipefail
          release_dir="out/nintendo_nx_arm64_armv8a/release"
          test -f "$release_dir/fusee.bin"
          test -f "$release_dir/atmosphere/package3"
          zip_file="$(find "$release_dir" -maxdepth 1 -type f -name 'atmosphere-*.zip' -print -quit)"
          test -n "$zip_file"
          unzip -tq "$zip_file"
          sha256sum "$zip_file"

      - name: Upload clean CNX package
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-CNX-clean-${{ github.sha }}
          path: out/nintendo_nx_arm64_armv8a/release/atmosphere-*.zip
          if-no-files-found: error
          retention-days: 14
