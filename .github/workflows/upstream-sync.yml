# Atmosphère-RYZ — automatic upstream sync
#
# EN: Periodically checks the original Atmosphère repo. When it has new commits,
#     applies the upstream changes onto a branch and opens a pull request so you
#     can review/apply them. Conflicts with Ryazhenka patches are left as .rej /
#     conflict markers for you to resolve. Never merges automatically.
# RU: Периодически проверяет оригинальную Atmosphère. При новых коммитах
#     накладывает изменения оригинала на отдельную ветку и открывает pull request,
#     чтобы ты сам решил применять или нет. Конфликты с патчами Ryazhenka
#     оставляются в виде .rej / маркеров. Автоматически ничего не мержится.
name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "ryazhenka-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream Atmosphère
        run: |
          set -eux
          git remote add upstream https://github.com/Atmosphere-NX/Atmosphere || true
          git fetch --no-tags upstream master

      - name: Detect upstream changes
        id: detect
        run: |
          set -eux
          LAST="$(tr -d '[:space:]' < .upstream-ref)"
          NEW="$(git rev-parse upstream/master)"
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}"   >> "$GITHUB_OUTPUT"
          if [ "${LAST}" = "${NEW}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Apply upstream changes onto a sync branch
        if: steps.detect.outputs.changed == 'true'
        id: apply
        run: |
          set -eux
          LAST="${{ steps.detect.outputs.last }}"
          NEW="${{ steps.detect.outputs.new }}"
          SHORT="$(echo "${NEW}" | cut -c1-12)"
          BRANCH="upstream-sync/${SHORT}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -B "${BRANCH}"
          # Apply only what changed upstream since the last sync (3-way; leaves .rej on conflict).
          git diff "${LAST}..${NEW}" | git apply --3way --whitespace=nowarn || true
          echo "${NEW}" > .upstream-ref
          # Collect the list of new upstream commits for the PR body.
          git log --oneline --no-merges "${LAST}..${NEW}" upstream/master > /tmp/upstream_commits.txt || true
          REJECTS="$(find . -name '*.rej' | sort || true)"
          { echo "rejects<<EOF"; echo "${REJECTS:-(none)}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "Sync upstream Atmosphère (${LAST:0:12}..${SHORT})" || echo "nothing to commit"

      - name: Create pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.apply.outputs.branch }}
          base: main
          title: "🔄 Upstream Atmosphère sync (${{ steps.detect.outputs.new }})"
          body: |
            ## 🔄 Автоматическая синхронизация с оригинальной Atmosphère

            🇷🇺 В оригинальной [Atmosphère](https://github.com/Atmosphere-NX/Atmosphere)
            появились новые коммиты. Их изменения наложены на эту ветку. Проверь
            их, разреши конфликты (файлы `*.rej`, если есть) и смержи, если хочешь.

            🇬🇧 The original Atmosphère has new commits. Their changes were applied
            to this branch. Review, resolve any `*.rej` conflicts, and merge if you
            want them.

            **Диапазон / Range:** `${{ steps.detect.outputs.last }}` → `${{ steps.detect.outputs.new }}`

            **Конфликтные файлы / Rejected hunks:**
            ```
            ${{ steps.apply.outputs.rejects }}
            ```

            > ⚠️ Эта ветка может затрагивать патчи Ryazhenka (splash, версия, AOTag).
            > Проверь их перед мержем.
          labels: upstream-sync
          delete-branch: true
