name: Build Ryazhenka Official Atmosphere

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build official Atmosphere with Ryazhenka branding
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with devkitPro
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            devkitpro/devkita64:latest \
            bash -lc 'git config --global --add safe.directory /workspace && make -j"$(nproc)"'

      - name: Verify branded release package
        run: |
          set -euo pipefail
          release_dir="out/nintendo_nx_arm64_armv8a/release"
          test -f "$release_dir/fusee.bin"
          zip_file="$(find "$release_dir" -maxdepth 1 -type f -name 'atmosphere-*.zip' ! -name '*-debug.zip' -print -quit)"
          test -n "$zip_file"
          unzip -tq "$zip_file"
          unzip -Z1 "$zip_file" | grep -Fx 'atmosphere/package3'
          unzip -Z1 "$zip_file" | grep -Fx 'atmosphere/reboot_payload.bin'
          python3 utilities/verify_ryazhenka_release.py "$zip_file"
          mkdir -p dist
          ryazhenka_version="$(awk '/^#define RYAZHENKA_RELEASE_VERSION_STRING / { gsub(/"/, "", $3); print $3 }' libraries/libvapours/include/vapours/ams/ams_api_version.h)"
          test -n "$ryazhenka_version"
          cp "$zip_file" "dist/ryazhenka-${ryazhenka_version}-atmosphere.zip"
          sha256sum "dist/ryazhenka-${ryazhenka_version}-atmosphere.zip"

      - name: Upload release-only test package
        uses: actions/upload-artifact@v4
        with:
          name: Ryazhenka-Atmosphere-Official-${{ github.sha }}
          path: dist/ryazhenka-*-atmosphere.zip
          if-no-files-found: error
          retention-days: 14
