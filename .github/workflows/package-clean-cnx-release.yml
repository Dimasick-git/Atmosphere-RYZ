name: Package Clean CNX Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package-release-only:
    name: Extract release ZIP only
    runs-on: ubuntu-latest
    steps:
      - name: Download successful CNX build artifact
        uses: actions/download-artifact@v7
        with:
          name: Atmosphere-CNX-clean-7db35d6455bb87af973562bd11eb2b7f9477ded8
          path: input
          run-id: 32475475206
          github-token: ${{ github.token }}

      - name: Select and verify release package
        run: |
          set -euo pipefail
          zip_file="$(find input -type f -name 'atmosphere-*.zip' ! -name '*-debug.zip' -print -quit)"
          test -n "$zip_file"
          unzip -tq "$zip_file"
          unzip -Z1 "$zip_file" | grep -Fx 'atmosphere/package3'
          unzip -Z1 "$zip_file" | grep -Fx 'atmosphere/reboot_payload.bin'
          mkdir -p dist
          cp "$zip_file" dist/
          sha256sum "dist/$(basename "$zip_file")"

      - name: Upload compact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-CNX-release-only-${{ github.sha }}
          path: dist/atmosphere-*.zip
          if-no-files-found: error
          retention-days: 14
